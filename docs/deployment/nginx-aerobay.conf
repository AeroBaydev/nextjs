# Install as /etc/nginx/sites-available/aerobay after replacing certificate paths.
upstream aerobay_api { server 127.0.0.1:5050; keepalive 16; }
upstream aerobay_demo_api { server 127.0.0.1:5051; keepalive 8; }

server {
  listen 80;
  server_name aerobay.in www.aerobay.in admin.aerobay.in api.aerobay.in demo-api.aerobay.in;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name aerobay.in www.aerobay.in;
  ssl_certificate /etc/letsencrypt/live/aerobay.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/aerobay.in/privkey.pem;
  root /srv/aerobay/current/website;
  index index.html;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location / { try_files $uri $uri.html $uri/ =404; }
  location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|avif|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}

server {
  listen 443 ssl http2;
  server_name admin.aerobay.in;
  ssl_certificate /etc/letsencrypt/live/admin.aerobay.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.aerobay.in/privkey.pem;
  root /srv/aerobay/current/admin;
  index index.html;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options nosniff always;
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 443 ssl http2;
  server_name api.aerobay.in;
  ssl_certificate /etc/letsencrypt/live/api.aerobay.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.aerobay.in/privkey.pem;
  client_max_body_size 1m;
  location / {
    proxy_pass http://aerobay_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }
}

server {
  listen 443 ssl http2;
  server_name demo-api.aerobay.in;
  ssl_certificate /etc/letsencrypt/live/demo-api.aerobay.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/demo-api.aerobay.in/privkey.pem;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  location / {
    proxy_pass http://aerobay_demo_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }
}
