name: Website CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Build production static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://aerobay.in
          NEXT_PUBLIC_API_URL: https://api.aerobay.in/api
          NEXT_PUBLIC_ENVIRONMENT: production

      - name: Validate and package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          test -f out/index.html
          test -d out/_next
          printf '%s\n' "$GITHUB_SHA" > out/release.txt
          tar -czf "$RUNNER_TEMP/aerobay-frontend-$GITHUB_SHA.tar.gz" -C out .
          gzip -t "$RUNNER_TEMP/aerobay-frontend-$GITHUB_SHA.tar.gz"

      - name: Upload production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}/aerobay-frontend-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}/deployment

      - name: Configure restricted SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/aerobay_frontend_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/aerobay_frontend_deploy"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          archive="$RUNNER_TEMP/deployment/aerobay-frontend-$GITHUB_SHA.tar.gz"
          remote_archive="/home/aerobay-deploy/incoming/aerobay-frontend-$GITHUB_SHA.tar.gz"
          ssh_options=(
            -i "$HOME/.ssh/aerobay_frontend_deploy"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )

          test -f "$archive"

          scp "${ssh_options[@]}" \
            "$archive" \
            "aerobay-deploy@$EC2_HOST:$remote_archive"

          ssh "${ssh_options[@]}" \
            "aerobay-deploy@$EC2_HOST" \
            /usr/local/bin/aerobay-frontend-deploy \
            "$GITHUB_SHA" \
            "$remote_archive"
